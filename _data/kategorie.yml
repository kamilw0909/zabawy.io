# Kolejnosc tutaj = kolejnosc na stronie.
# slug  - krotka nazwa techniczna, uzywana w plikach zabaw (pole "kategoria")
# nazwa - nazwa wyswietlana, mozna ja zmieniac bez ruszania zabaw
- slug: lina
  nazwa: Z liną i na zatrzymanie
  opis: Zabawy z linką oraz zabawy na reakcję i zastygnięcie.
- slug: pilka
  nazwa: Z piłką tenisową
  opis: Toczenie, celowanie, podawanie i współpraca, bez rzucania w siebie nawzajem.